<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>匿名 FX History確認</title>
<link rel="icon" href="../assets/icon-192.png"><link rel="stylesheet" href="../history/history.css?v=20261015-7">
<script defer src="../assets/storage-transaction.js?v=20261015-1"></script>
<script defer src="../assets/transaction-reconciliation.js?v=20261013-1"></script>
<script defer src="../assets/monthly-source-contract.js?v=20261015-6"></script>
<script defer src="../assets/transaction-source-contract.js?v=20261015-1"></script>
<script defer src="../assets/transaction-adoption-view.js?v=20261015-2"></script>
<script defer src="../assets/data-model-storage.js?v=20261015-3"></script>
<script defer src="../assets/transaction-view.js?v=20261015-2"></script>
<script defer src="../assets/transaction-display.js?v=20261015-2"></script>
<script defer src="../history/transaction-ui.js?v=20261015-2"></script>
<script defer src="fx-history-fixture.js"></script><script defer src="fx-history-browser.js"></script></head>
<body><main class="container"><h1>匿名 FX History確認</h1><p>架空データのみ・Storage書込なし</p>
<div><button id="light">LIGHT FX</button><button id="minna">みんなのFX</button><button id="candidate">訂正候補追加</button><button id="adopt">訂正を採用</button><button id="defer">保留</button><button id="stale">stale確認</button><button id="empty">保有ではなく取引0件確認</button><button id="cleanup">検証を終了</button></div>
<p id="qaStatus"></p><section class="section glass"><h2>取引履歴</h2>
<div class="form-grid"><label class="form-group"><span>月</span><input type="month" id="filterMonth" value="2034-04"></label><label class="form-group"><span>口座</span><select id="filterAccount"></select></label></div>
<details class="history-advanced"><summary id="historyFilterLabel">絞り込み</summary><div class="form-grid"><label class="form-group"><span>銘柄</span><select id="filterSymbol"></select></label><label class="form-group"><span>区分</span><select id="filterCategory"></select></label><label class="form-group"><span>出典</span><select id="filterSource"></select></label><label class="form-group"><span>戦略</span><select id="filterStrategy"></select></label><label class="form-group"><span>並び順</span><select id="sortOrder"><option value="newest">新しい順</option><option value="oldest">古い順</option></select></label></div></details>
<div id="historyBody" class="transaction-list" role="list"></div><div class="history-list-footer"><span id="historyCount"></span><button id="historyMore">もっと見る</button></div></section></main></body></html>
