<body><main class="container"><h1>匿名 History List検証</h1><p>架空データ・メモリ内保存のみ</p>
<div class="transaction-confirmation-actions"><button id="light" type="button">LIGHT FX</button><button id="minna" type="button">みんなのFX</button><button id="pagination" type="button">51件のPDFで検証</button></div>
<section class="section glass"><h2>取引履歴</h2>
<div class="form-grid"><label class="form-group"><span>月</span><input type="month" id="filterMonth" value="2034-04"></label><label class="form-group"><span>口座</span><select id="filterAccount"></select></label></div>
<details class="history-advanced"><summary id="historyFilterLabel">絞り込み</summary><div class="form-grid"><label class="form-group"><span>銘柄</span><select id="filterSymbol"></select></label><label class="form-group"><span>区分</span><select id="filterCategory"></select></label><label class="form-group"><span>出典</span><select id="filterSource"></select></label><label class="form-group"><span>戦略</span><select id="filterStrategy"></select></label><label class="form-group"><span>並び順</span><select id="sortOrder"><option value="newest">新しい順</option><option value="oldest">古い順</option></select></label></div></details>
<div id="historyBody" class="transaction-list" role="list"></div><div class="history-list-footer"><span id="historyCount"></span><button id="historyMore" type="button">もっと見る</button></div></section></main></body></html>
