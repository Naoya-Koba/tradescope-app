<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121833">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>データ取込 | TradeScope</title>
  <link rel="icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="assets/transitions.css">
  <link rel="stylesheet" href="import/preview.css?v=20261012-1">
  <script defer src="assets/account-ui.js?v=20261011-1"></script>
  <script defer src="import/csv-core.js?v=20261005-1"></script>
  <script defer src="import/sbi-parser.js?v=20261009-2"></script>
  <script defer src="assets/storage-transaction.js?v=20261012-3"></script>
  <script defer src="assets/data-model-storage.js?v=20261012-4"></script>
  <script defer src="assets/transaction-view.js?v=20261012-3"></script>
  <script defer src="import/model-preview.js?v=20261010-1"></script>
  <script defer src="import/sbi-save.js?v=20261010-1"></script>
  <script defer src="import/preview.js?v=20261010-1"></script>
  <script defer src="import/gmo-transactions-parser.js?v=20261012-4"></script>
  <script defer src="import/gmo-parser.js?v=20261012-4"></script>
  <script defer src="assets/monthly-account-resolver.js?v=20261012-1"></script>
  <script defer src="import/gmo-save.js?v=20261012-4"></script>
  <script defer src="import/gmo-preview.js?v=20261012-4"></script>
  <script defer src="import/traders-parser.js?v=20261012-1"></script>
  <script defer src="import/traders-save.js?v=20261012-2"></script>
  <script defer src="import/traders-preview.js?v=20261012-2"></script>
</head>
<body>
  <header><a href="index.html" aria-label="トップへ戻る">‹ TradeScope</a></header>
  <main>
    <h1>データ取込</h1>
    <div class="providers">
      <details id="sbi-provider" class="provider">
        <summary>SBI証券<span class="disclosure" aria-hidden="true">⌄</span></summary>
        <div class="provider-content">
          <div class="file-options">
            <div class="file-row">
              <div><h3>保有証券CSV</h3><button class="help" data-help="holdings">取得方法を見る</button></div>
              <label class="file-button">ファイルを選択<input id="holdings-file" type="file" accept=".csv,text/csv" data-kind="holdings" aria-label="保有証券CSVを選択" aria-describedby="holdings-file-example"></label>
              <p id="holdings-file-example" class="file-example">例：SaveFile.csv</p>
            </div>
            <div class="file-row">
              <div><h3>約定履歴CSV</h3><button class="help" data-help="transactions">取得方法を見る</button></div>
              <label class="file-button">ファイルを選択<input id="transactions-file" type="file" accept=".csv,text/csv" data-kind="transactions" aria-label="約定履歴CSVを選択" aria-describedby="transactions-file-example"></label>
              <p id="transactions-file-example" class="file-example">例：SaveFile_数字列.csv</p>
            </div>
          </div>
          <label class="encoding">文字コード<select id="encoding"><option value="auto">自動</option><option value="utf-8">UTF-8</option><option value="shift_jis">Shift_JIS / CP932</option></select></label>
          <p id="read-status" class="muted" role="status" aria-live="polite"></p>
          <div id="loaded-previews" class="loaded-previews" aria-label="読み込んだCSV" hidden></div>
          <section id="preview" aria-labelledby="preview-title" hidden>
            <div class="preview-heading"><h2 id="preview-title">確認</h2><button id="close-preview" class="secondary">閉じる</button></div>
            <div id="dates" class="date-fields" hidden>
              <label>対象月<input id="target-month" type="month"></label>
              <label><span id="observed-label">取得日</span><input id="observed-date" type="date"></label>
              <span id="date-note" class="muted"></span>
            </div>
            <dl id="summary"></dl>
            <div id="groups"></div>
            <div id="issues" aria-live="polite"></div>
            <details id="details"><summary>明細を見る</summary><div class="table-wrap"><table><thead id="detail-head"></thead><tbody id="detail-body"></tbody></table></div><button id="more-rows" class="secondary" hidden>続きを表示</button></details>
            <div id="planned" class="planned" hidden>
              <h3>保存予定内容</h3>
              <dl id="planned-summary"></dl>
              <div id="planned-issues" aria-live="polite"></div>
              <details id="planned-details"><summary>取り込み内容を見る</summary><div id="planned-rows"></div><button id="more-planned" class="secondary" hidden>続きを表示</button></details>
            </div>
            <div id="save-actions" class="save-actions" aria-live="polite" hidden>
              <p id="save-status" class="muted" role="status"></p>
              <button id="save-preview" type="button" class="primary" hidden>保存</button>
            </div>
          </section>
        </div>
      </details>
      <details id="gmo-provider" class="provider">
        <summary><span data-account-label="gmo">GMO FXneo</span><span class="disclosure" aria-hidden="true">⌄</span></summary>
        <div class="provider-content">
          <div class="file-row">
            <h3>月次取引残高報告書PDF</h3>
            <label class="file-button">ファイルを選択<input id="gmo-file" type="file" accept=".pdf,application/pdf" aria-label="GMO月次PDFを選択"></label>
          </div>
          <div class="save-actions"><p id="gmo-read-status" class="muted" role="status" aria-live="polite"></p><button id="gmo-cancel-read" class="secondary" hidden>中止</button></div>
          <section id="gmo-preview" hidden aria-label="GMO月次データ">
            <div class="preview-heading"><h2>確認</h2><button id="gmo-close" class="secondary">閉じる</button></div>
            <dl id="gmo-summary"></dl>
            <div id="gmo-issues" aria-live="polite"></div>
            <div class="save-actions"><p id="gmo-save-status" class="muted" role="status"></p><button id="gmo-save" class="primary" hidden>保存</button></div>
          </section>
        </div>
      </details>
      <details id="lightfx-provider" class="provider">
        <summary>LIGHT FX<span class="disclosure" aria-hidden="true">⌄</span></summary>
        <div class="provider-content">
          <div class="file-row"><h3>月次取引報告書PDF</h3><label class="file-button">ファイルを選択<input id="lightfx-file" type="file" accept=".pdf,application/pdf" aria-label="LIGHT FX月次PDFを選択"></label></div>
          <div class="save-actions"><p id="lightfx-read-status" class="muted" role="status" aria-live="polite"></p><button id="lightfx-cancel-read" class="secondary" hidden>中止</button></div>
          <section id="lightfx-preview" hidden aria-label="LIGHT FX月次データ">
            <div class="preview-heading"><h2>確認</h2><button id="lightfx-close" class="secondary">閉じる</button></div>
            <dl id="lightfx-summary"></dl><div id="lightfx-issues" aria-live="polite"></div>
            <label id="lightfx-swap-group" class="calendar-swap" hidden>スワップ損益<input id="lightfx-swap" type="text" inputmode="numeric" placeholder="—"><span class="muted">収益カレンダー「スワップ付与」月間合計</span></label>
            <div class="save-actions"><p id="lightfx-save-status" class="muted" role="status"></p><button id="lightfx-save" class="primary" hidden>保存</button></div>
          </section>
        </div>
      </details>
      <details id="minano-provider" class="provider">
        <summary>みんなのFX<span class="disclosure" aria-hidden="true">⌄</span></summary>
        <div class="provider-content">
          <div class="file-row"><h3>月次取引報告書PDF</h3><label class="file-button">ファイルを選択<input id="minano-file" type="file" accept=".pdf,application/pdf" aria-label="みんなのFX月次PDFを選択"></label></div>
          <div class="save-actions"><p id="minano-read-status" class="muted" role="status" aria-live="polite"></p><button id="minano-cancel-read" class="secondary" hidden>中止</button></div>
          <section id="minano-preview" hidden aria-label="みんなのFX月次データ">
            <div class="preview-heading"><h2>確認</h2><button id="minano-close" class="secondary">閉じる</button></div>
            <dl id="minano-summary"></dl><div id="minano-issues" aria-live="polite"></div>
            <label id="minano-swap-group" class="calendar-swap" hidden>スワップ損益<input id="minano-swap" type="text" inputmode="numeric" placeholder="—"><span class="muted">収益カレンダー「スワップ付与」月間合計</span></label>
            <div class="save-actions"><p id="minano-save-status" class="muted" role="status"></p><button id="minano-save" class="primary" hidden>保存</button></div>
          </section>
        </div>
      </details>
      <button class="provider-pending" disabled><span data-account-label="sbivc">SBI VC</span><span class="muted">準備中</span></button>
    </div>
  </main>
  <dialog id="help-dialog" aria-labelledby="help-title">
    <h2 id="help-title"></h2>
    <ol id="help-steps"></ol>
    <a id="official-help" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">SBI証券の案内を開く</a>
    <button id="close-help" class="secondary">閉じる</button>
  </dialog>
  <dialog id="save-dialog" aria-labelledby="save-title">
    <h2 id="save-title">SBI証券</h2>
    <dl id="save-summary"></dl>
    <div class="dialog-actions">
      <button id="cancel-save" type="button" class="secondary" autofocus>キャンセル</button>
      <button id="confirm-save" type="button" class="primary">保存</button>
    </div>
  </dialog>
  <dialog id="gmo-save-dialog" aria-labelledby="gmo-save-title">
    <h2 id="gmo-save-title">GMO FXneo</h2>
    <dl id="gmo-save-summary"></dl>
    <div class="dialog-actions">
      <button id="gmo-cancel-save" class="secondary" autofocus>キャンセル</button>
      <button id="gmo-confirm-save" class="primary">保存</button>
    </div>
  </dialog>
  <dialog id="lightfx-dialog" aria-labelledby="lightfx-confirm-title">
    <h2 id="lightfx-confirm-title">LIGHT FX</h2><dl id="lightfx-confirm-summary"></dl>
    <div class="dialog-actions"><button id="lightfx-cancel-save" class="secondary" autofocus>キャンセル</button><button id="lightfx-confirm-save" class="primary">保存</button></div>
  </dialog>
  <dialog id="minano-dialog" aria-labelledby="minano-confirm-title">
    <h2 id="minano-confirm-title">みんなのFX</h2><dl id="minano-confirm-summary"></dl>
    <div class="dialog-actions"><button id="minano-cancel-save" class="secondary" autofocus>キャンセル</button><button id="minano-confirm-save" class="primary">保存</button></div>
  </dialog>
</body>
</html>
